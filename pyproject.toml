[project]
name = "vendorlens-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["vendorlens-api", "vendorlens-core", "vendorlens-worker"]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
vendorlens-api = { workspace = true }
vendorlens-core = { workspace = true }
vendorlens-worker = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/vendorlens-core"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/vendorlens-core/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vendorlens_api", "vendorlens_core", "vendorlens_worker"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["vendorlens_api", "vendorlens_core", "vendorlens_worker"]
mypy_path = ["apps/api/src", "apps/worker/src", "packages/vendorlens-core/src"]
