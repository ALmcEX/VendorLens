[project]
name = "vendorlens-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["vendorlens-core"]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
vendorlens-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/vendorlens-core"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["packages/vendorlens-core/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["vendorlens_core"]
mypy_path = ["packages/vendorlens-core/src"]
