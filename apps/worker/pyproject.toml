[project]
name = "vendorlens-worker"
version = "0.1.0"
description = "VendorLens durable background worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "vendorlens-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendorlens_worker"]

[tool.uv.sources]
vendorlens-core = { workspace = true }

[project.scripts]
vendorlens-worker = "vendorlens_worker.main:run"
