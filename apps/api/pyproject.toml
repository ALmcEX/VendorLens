[project]
name = "vendorlens-api"
version = "0.1.0"
description = "VendorLens HTTP API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "vendorlens-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendorlens_api"]

[tool.uv.sources]
vendorlens-core = { workspace = true }
