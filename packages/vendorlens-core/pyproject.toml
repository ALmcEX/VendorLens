[project]
name = "vendorlens-core"
version = "0.1.0"
description = "Framework-independent domain contracts for VendorLens"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.12,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendorlens_core"]
